[project]
name = "vta"
version = "0.1.0"
description = "Voice tone and background noise analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "funasr>=1.4.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "librosa>=0.11.0",
    "modelscope>=1.39.1",
    "nemo-toolkit[asr]>=3.0.0",
    "numpy>=2.4.6",
    "openai>=3.0.0",
    "panns-inference>=0.1.1",
    "pyannote-audio>=4.0.7",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vta"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
