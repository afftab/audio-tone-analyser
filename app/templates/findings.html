{% extends "base.html" %}
{% block title %}Findings{% endblock %}
{% block nav %}<a href="/">Dashboard</a><a href="/logout">Log out</a>{% endblock %}
{% block content %}
<div class="pagehead">
  <h1>Validation findings</h1>
  <span class="pagehead__spacer"></span>
  <a class="btn btn--sm" href="/findings.pdf?v={{ findings_pdf_version() }}" target="_blank" rel="noopener">Download PDF</a>
</div>
{% if findings_pages %}
<div class="pdf-pages">
  {% for name in findings_pages %}
  <img class="pdf-page" src="/findings/page/{{ name }}?v={{ findings_render_version() }}" alt="Validation findings report, page {{ loop.index }}" width="1700" height="2200">
  {% endfor %}
</div>
{% else %}
<object class="findings-pdf" data="/findings.pdf?v={{ findings_pdf_version() }}" type="application/pdf" aria-label="Validation findings report (PDF)">
  <p style="padding: var(--s4); color: var(--text);">
    Your browser cannot display embedded PDFs &mdash;
    <a href="/findings.pdf?v={{ findings_pdf_version() }}" target="_blank" rel="noopener">open the report in a new tab</a>.
  </p>
</object>
{% endif %}
{% endblock %}
